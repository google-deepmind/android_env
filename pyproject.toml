[build-system]
requires = [
    "setuptools",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "android-env"
version = "2.0.0"
description = "AndroidEnv environment and library for training agents."
authors = [{name = "DeepMind"}]
license = {file = "LICENSE"}
readme = {text = "Read the README at https://github.com/google-deepmind/android_env for more information.", content-type = "text/plain"}
keywords = ["Android", "OS", "reinforcement-learning"]
requires-python = ">=3.10"
dependencies = [
    "absl-py>=2.1.0",
    "dm_env>=1.6",
    "numpy>=2.1.0",
    "portpicker>=1.6.0",
    "protobuf>=6,<8",
    "pillow>=10.4.0",
    "opencv-python-headless>=4.10.0",
    "websocket-client>=1.8.0",
]

[project.optional-dependencies]
testing = [
    "gymnasium",
    "pytype",
]
acme = ["dm-acme"]
gym = ["gymnasium>=0.29.1"]
mcp = ["mcp>=1.26,<2"]
playground = ["ml-collections"]

[project.scripts]
android-env-mcp = "android_env.mcp.android_mcp_server:run"
android-env-playground = "android_env.playground.playground:run"

[tool.setuptools.package-data]
"android_env.apps.java.com.google.androidenv.core" = ["*.apk"]
"android_env.components" = ["*.textproto"]
"android_env.playground.frontend" = ["index.html", "*.js"]

[project.urls]
repository = "https://github.com/google-deepmind/android_env"
deepmind = "https://www.deepmind.com/publications/androidenv-the-android-learning-environment"
arxiv = "https://arxiv.org/abs/2105.13231"
